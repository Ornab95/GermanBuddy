<header class="sticky top-4 z-50 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mb-8">
  <div class="flex items-center justify-between py-3 px-5 sm:px-6 rounded-2xl glass-card border border-slate-700/60 shadow-2xl backdrop-blur-xl bg-slate-950/70">
    
    <!-- Logo -->
    <a routerLink="/" (click)="closeMobileMenu()" class="flex items-center gap-3 group cursor-pointer">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-violet-600 via-cyan-500 to-emerald-400 p-0.5 shadow-lg shadow-violet-500/25 group-hover:scale-105 transition-transform duration-300">
        <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center font-black text-violet-400 text-base tracking-wider">
          DE
        </div>
      </div>
      <div class="flex flex-col">
        <div class="flex items-center gap-2">
          <span class="text-xl font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-slate-100 via-slate-200 to-violet-300">
            DeutschBuddy
          </span>
          <span class="text-[10px] px-2 py-0.5 rounded-full bg-violet-500/15 border border-violet-500/30 text-violet-300 font-bold uppercase tracking-wider">
            বাংলায়
          </span>
        </div>
      </div>
    </a>

    <!-- Desktop Navigation Menu -->
    <nav class="hidden md:flex items-center gap-1.5 text-xs font-semibold">
      <a routerLink="/" 
         routerLinkActive="bg-violet-500/15 text-violet-300 border-violet-500/30 shadow-sm" 
         [routerLinkActiveOptions]="{exact: true}"
         class="px-3.5 py-2 rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 border border-transparent transition-all">
        হোম
      </a>
      
      <a routerLink="/alphabet" 
         routerLinkActive="bg-violet-500/15 text-violet-300 border-violet-500/30 shadow-sm"
         class="px-3.5 py-2 rounded-xl text-slate-300 hover:text-violet-400 hover:bg-slate-800/60 border border-transparent transition-all flex items-center gap-1.5">
        <span class="text-violet-400">Aa</span> বর্ণমালা
      </a>

      <a routerLink="/numbers" 
         routerLinkActive="bg-cyan-500/15 text-cyan-300 border-cyan-500/30 shadow-sm"
         class="px-3.5 py-2 rounded-xl text-slate-300 hover:text-cyan-400 hover:bg-slate-800/60 border border-transparent transition-all flex items-center gap-1.5">
        <span class="text-cyan-400">123</span> সংখ্যা
      </a>

      <a routerLink="/vocabulary" 
         routerLinkActive="bg-indigo-500/15 text-indigo-300 border-indigo-500/30 shadow-sm"
         class="px-3.5 py-2 rounded-xl text-slate-300 hover:text-indigo-400 hover:bg-slate-800/60 border border-transparent transition-all flex items-center gap-1.5">
        <span class="text-indigo-400">📖</span> শব্দকোষ
      </a>

      <a routerLink="/conversation" 
         routerLinkActive="bg-emerald-500/15 text-emerald-300 border-emerald-500/30 shadow-sm"
         class="px-3.5 py-2 rounded-xl text-slate-300 hover:text-emerald-400 hover:bg-slate-800/60 border border-transparent transition-all flex items-center gap-1.5">
        <span class="text-emerald-400">💬</span> সংলাপ
      </a>

      <a routerLink="/game" 
         routerLinkActive="bg-amber-500/15 text-amber-300 border-amber-500/30 shadow-sm"
         class="px-3.5 py-2 rounded-xl text-slate-300 hover:text-amber-400 hover:bg-slate-800/60 border border-transparent transition-all flex items-center gap-1.5">
        <span class="text-amber-400">🎮</span> শব্দ খেলা
      </a>
    </nav>

    <!-- Header Right Action -->
    <div class="hidden sm:flex items-center gap-3">
      <a routerLink="/game" 
         class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-violet-600 via-indigo-600 to-cyan-500 text-white text-xs font-bold shadow-lg shadow-violet-600/30 hover:scale-105 active:scale-95 transition-all">
        <span>🎮 শব্দ খেলা</span>
      </a>
    </div>

    <!-- Mobile Hamburger Menu Button -->
    <button (click)="toggleMobileMenu()" class="md:hidden p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        @if (!isMobileMenuOpen()) {
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        } @else {
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        }
      </svg>
    </button>
  </div>

  <!-- Mobile Dropdown Navigation -->
  @if (isMobileMenuOpen()) {
    <div class="md:hidden mt-3 p-4 rounded-2xl glass-card border border-slate-800 bg-slate-950/95 backdrop-blur-2xl shadow-2xl flex flex-col gap-2 text-sm font-semibold animate-in fade-in slide-in-from-top-4 duration-200">
      <a routerLink="/" (click)="closeMobileMenu()" class="px-4 py-3 rounded-xl hover:bg-slate-900 text-slate-200 flex items-center gap-3">
        <span>🏠</span> হোম (ড্যাশবোর্ড)
      </a>
      <a routerLink="/alphabet" (click)="closeMobileMenu()" class="px-4 py-3 rounded-xl hover:bg-slate-900 text-slate-200 flex items-center gap-3">
        <span class="text-violet-400">Aa</span> বর্ণমালা (Alphabet)
      </a>
      <a routerLink="/numbers" (click)="closeMobileMenu()" class="px-4 py-3 rounded-xl hover:bg-slate-900 text-slate-200 flex items-center gap-3">
        <span class="text-cyan-400">123</span> সংখ্যা (Numbers)
      </a>
      <a routerLink="/vocabulary" (click)="closeMobileMenu()" class="px-4 py-3 rounded-xl hover:bg-slate-900 text-slate-200 flex items-center gap-3">
        <span class="text-indigo-400">📖</span> শব্দকোষ (Vocabulary)
      </a>
      <a routerLink="/conversation" (click)="closeMobileMenu()" class="px-4 py-3 rounded-xl hover:bg-slate-900 text-slate-200 flex items-center gap-3">
        <span class="text-emerald-400">💬</span> সংলাপ (Conversation)
      </a>
      <a routerLink="/game" (click)="closeMobileMenu()" class="px-4 py-3 rounded-xl bg-amber-500/10 text-amber-300 border border-amber-500/20 flex items-center gap-3 font-bold">
        <span>🎮</span> শব্দ খেলা (Word Game)
      </a>
    </div>
  }
</header>
